name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: CLI smoke
        run: |
          chmod +x bin/torrent-tui
          bin/torrent-tui --help
          bin/torrent-tui --version
          if bin/torrent-tui nope.txt; then
            echo "Expected invalid torrent path to fail"
            exit 1
          fi

      - name: Package dry run
        run: bun publish --dry-run
